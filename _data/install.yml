# How a ROM is installed on each device, used by the "Install a ROM" guide.
# flash: images flashed before the recovery, in order (from the LineageOS Wiki,
#        plus vbmeta / vbmeta_system when the device builds ship them).
# recovery: partition the recovery goes to: boot (boot.img) or recovery (recovery.img).
#           boot.img is always flashed: as the recovery, or before it.
# Devices still in development or coming soon are hidden from the guide until
# they get a released build.

bangkk: { flash: [dtbo, vendor_boot, vbmeta, vbmeta_system], recovery: boot }
bathena: { flash: [dtbo, vbmeta, boot], recovery: recovery }
