# Moto Camera prebuilts for custom ROMs — source: MotCamera-common README (android-17).
# Repo URLs are built as <gitlab><name>; clone folders as vendor/motorola/<name>.
branch: android-17
gitlab: https://gitlab.com/Deivid21/proprietary_vendor_motorola_
image: https://play-lh.googleusercontent.com/C7-93qnLZBbZSe0geh2tIalXLzyBoiq0pAnHLxDyC3Z96Sipfis9hzGJ-OSeZ9kwSO_qttNyvzSkoTaSvq-n=w416-h235-rw
example_commit: https://github.com/Evolution-X-Devices/device_motorola_bangkk/commit/49025e7626cb2057be25acb57bee4795aeb74798
packages:
- Moto Camera 2
- Moto Camera 3
- Moto Camera 4
- Moto Camera AI
- Moto Photo Editor
- Moto Signature App
- Motorola Settings Provider
common_repos:
- name: MotCamera-common
  label: Moto Camera common
- name: MotorolaSettingsProvider
  label: Motorola Settings Provider (required for the app to work)
  label_es: Motorola Settings Provider (necesario para que la app funcione)
- name: MotCameraAI-common
  label: Moto Camera AI common
- name: MotoSignatureApp
  label: Moto Signature App
repos:
- name: MotCamera2
  version: Moto Camera 2
  platforms:
  - trinket
  - sdmmagpie
  - bengal
  - lito
  - kona
  socs:
  - SM6125
  - SM6150/SM7150
  - SM4250/SM6115
  - SM7250
  - SM8250
  inherit: $(call inherit-product, vendor/motorola/MotCamera2/motcamera2.mk)
  extras:
  - MotoPhotoEditor
  - MotCamera2AI
- name: MotCamera4-sm7150
  version: Moto Camera 4 & 3
  platforms:
  - sdmmagpie
  socs:
  - SM6150/SM7150
  inherit: $(call inherit-product, vendor/motorola/MotCamera4-sm7150/motcamera4.mk)
  extras:
  - MotoPhotoEditor
  - MotCamera2AI
  - MotCamera3AI-sm7150
- name: MotCamera4-bengal
  version: Moto Camera 4 & 3
  platforms:
  - bengal
  - khaje
  socs:
  - SM4250/SM6115
  - SM6225
  inherit: $(call inherit-product, vendor/motorola/MotCamera4-bengal/motcamera4.mk)
  extras:
  - MotoPhotoEditor
  - MotCamera2AI
  - MotCamera3AI-bengal
- name: MotCamera4-sm8250
  version: Moto Camera 4 & 3
  platforms:
  - lagoon
  - lito
  - kona
  socs:
  - SM7225
  - SM7250
  - SM8250
  inherit: $(call inherit-product, vendor/motorola/MotCamera4-sm8250/motcamera4.mk)
  extras:
  - MotoPhotoEditor
  - MotCamera2AI
  - MotCamera3AI-sm8250
- name: MotCamera4-sm6375
  version: Moto Camera 4
  platforms:
  - holi
  - blair
  socs:
  - SM4350
  - SM4375
  - SM6375
  inherit: $(call inherit-product, vendor/motorola/MotCamera4-sm6375/motcamera4.mk)
  extras:
  - MotoPhotoEditor
  - MotCamera3AI-sm6375
- name: MotCamera4-lahaina
  version: Moto Camera 4
  platforms:
  - yupik
  - lahaina
  socs:
  - SM7325
  - SM8350
  inherit: $(call inherit-product, vendor/motorola/MotCamera4-lahaina/motcamera4.mk)
  extras:
  - MotoPhotoEditor
  - MotCamera3AI-lahaina
- name: MotCamera4-sm7435
  version: Moto Camera 4
  platforms:
  - parrot
  socs:
  - SM6450
  inherit: $(call inherit-product, vendor/motorola/MotCamera4-sm7435/motcamera4.mk)
  extras:
  - MotCamera3AI-sm7435
- name: MotCamera4-sm8475
  version: Moto Camera 4
  platforms:
  - cape
  socs:
  - SM8475
  inherit: $(call inherit-product, vendor/motorola/MotCamera4-sm8475/motcamera4.mk)
  extras:
  - MotCamera3AI-sm8475
- name: MotCamera4-sm8550
  version: Moto Camera 4
  platforms:
  - kalama
  socs:
  - SM8550
  inherit: $(call inherit-product, vendor/motorola/MotCamera4-sm8550/motcamera4.mk)
  extras:
  - MotCamera3AI-sm8550
