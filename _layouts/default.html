<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <script>try{if(localStorage.getItem('lang')==='es')document.documentElement.lang='es'}catch(e){}</script>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script id="i18n-data" type="application/json">{{ site.data.i18n | jsonify }}</script>
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
