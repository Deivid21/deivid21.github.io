<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <script>try{var d=document.documentElement,th=localStorage.getItem('theme');if(localStorage.getItem('lang')==='es')d.lang='es';if(th==='light'||th==='dark')d.dataset.theme=th}catch(e){}</script>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script id="i18n-data" type="application/json">{{ site.data.i18n | jsonify }}</script>
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
