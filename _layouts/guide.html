---
layout: default
---
{% assign t = site.data.i18n.en %}
<div class="container narrow">
  <nav class="breadcrumb">
    <a href="{{ '/guides/' | relative_url }}" data-i18n="nav_guides">{{ t.nav_guides }}</a> /
    <span{% if page.title_es %} data-es="{{ page.title_es | escape }}"{% endif %}>{{ page.title }}</span>
  </nav>
  <article class="prose">
    <h1{% if page.title_es %} data-es="{{ page.title_es | escape }}"{% endif %}>{{ page.title }}</h1>
    {% if page.description %}<p class="lead"{% if page.description_es %} data-es="{{ page.description_es | escape }}"{% endif %}>{{ page.description }}</p>{% endif %}
    {% if page.updated %}<p class="muted small"><span data-i18n="updated">{{ t.updated }}</span>: {{ page.updated | date: "%Y-%m-%d" }}</p>{% endif %}
    {{ content }}
  </article>
</div>
