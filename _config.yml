# ── Site ─────────────────────────────────────────────
title: Deivid21 Hub
description: ROMs, firmware and resources for Motorola devices
author: Deivid21
copyright:
  name: Deivid Ignacio Parra (Deivid21)
  since: 2017
url: "https://deivid21.github.io"
baseurl: ""
lang: en

# ── Links ────────────────────────────────────────────
telegram: https://t.me/Deivid21Hub
github: https://github.com/Deivid21
gitlab: https://gitlab.com/Deivid21

# Donations
donate:
  github_sponsors: https://github.com/sponsors/Deivid21
  paypal: https://paypal.me/Deivid21

# Device images (LineageOS wiki). <codename>.png is appended
lineage_img: https://raw.githubusercontent.com/LineageOS/lineage_wiki/refs/heads/main/images/devices/

# ROM links, built from the device codename. {codename} is replaced automatically.
# A ROM entry in a device file can override them with its own download: / changelog:
rom_links:
  LineageOS:
    download: https://download.lineageos.org/devices/{codename}/builds
    changelog: https://download.lineageos.org/devices/{codename}/changes
  Evolution X:
    download: https://evolution-x.org/device/{codename}

# Live build info for official ROMs, loaded in the browser on each device page.
# {codename} and {branch} are replaced automatically.
official_sources:
  lineageos:
    builds: https://download.lineageos.org/api/v2/devices/{codename}/builds
    targets: https://raw.githubusercontent.com/LineageOS/hudson/main/lineage-build-targets
    wiki: https://raw.githubusercontent.com/LineageOS/lineage_wiki/main/_data/devices/{codename}.yml
  evolution-x:
    devices: https://raw.githubusercontent.com/Evolution-X/www_gitres/main/devices/devices.json
    versions: https://raw.githubusercontent.com/Evolution-X/www_gitres/main/version/versions.json
    builds: https://raw.githubusercontent.com/Evolution-X/OTA/{branch}/builds/{codename}.json

# ── Collections ──────────────────────────────────────
collections:
  devices:
    output: true
    permalink: /devices/:name/
  guides:
    output: true
    permalink: /guides/:name/

defaults:
  - scope: { path: "", type: devices }
    values: { layout: device }
  - scope: { path: "", type: guides }
    values: { layout: guide }

# Plugins supported by GitHub Pages
plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
