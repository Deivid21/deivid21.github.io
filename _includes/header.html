{% assign t = site.data.i18n.en %}
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/favicon.svg' | relative_url }}" alt="" width="28" height="28">
      <span>{{ site.title }}</span>
    </a>
    <nav class="nav-links">
      <a href="{{ '/devices/' | relative_url }}" {% if page.layout == 'device' or page.url == '/devices/' %}class="active"{% endif %} data-i18n="nav_devices">{{ t.nav_devices }}</a>
      <a href="{{ '/moto-camera/' | relative_url }}" {% if page.url == '/moto-camera/' %}class="active"{% endif %}><span class="nav-short-hide">Moto </span>Camera</a>
      <a href="{{ '/guides/' | relative_url }}" {% if page.layout == 'guide' or page.url == '/guides/' %}class="active"{% endif %} data-i18n="nav_guides">{{ t.nav_guides }}</a>
      <a class="nav-telegram" href="{{ site.telegram }}" target="_blank" rel="noopener">Telegram</a>
      <a class="nav-donate{% if page.url == '/donate/' %} active{% endif %}" href="{{ '/donate/' | relative_url }}">
        {% include icons/githubsponsors.svg %}<span data-i18n="nav_donate">{{ t.nav_donate }}</span>
      </a>
      <button id="theme-toggle" class="theme-toggle" type="button" title="{{ t.theme_auto }}" aria-label="{{ t.theme_auto }}">
        <svg class="ic-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <svg class="ic-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Change language / Cambiar idioma">
        <span data-lang-opt="en">EN</span><span data-lang-opt="es">ES</span>
      </button>
    </nav>
  </div>
</header>
