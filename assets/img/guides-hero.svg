<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Step by step guide next to a phone">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a4e"/>
      <stop offset="1" stop-color="#1c2628"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69d5e8"/>
      <stop offset=".6" stop-color="#0097a7"/>
      <stop offset="1" stop-color="#01363e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- guide sheet with numbered steps -->
  <g transform="translate(40 34) rotate(-4 120 120)" filter="url(#shadow)">
    <rect width="236" height="236" rx="24" fill="#ffffff"/>
    <rect x="22" y="22" width="120" height="12" rx="6" fill="#0097a7"/>
    <rect x="22" y="42" width="170" height="7" rx="3.5" fill="#cfe3e6"/>
    <g font-family="Google Sans Flex, Roboto, Arial, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      <circle cx="36" cy="86" r="13" fill="#0097a7"/><text x="36" y="90.5" fill="#fff">1</text>
      <circle cx="36" cy="132" r="13" fill="#0097a7"/><text x="36" y="136.5" fill="#fff">2</text>
      <circle cx="36" cy="178" r="13" fill="#e2eef0"/><text x="36" y="182.5" fill="#006876">3</text>
    </g>
    <path d="M36 99 V119 M36 145 V165" stroke="#cfe3e6" stroke-width="3" stroke-linecap="round"/>
    <rect x="60" y="78" width="130" height="8" rx="4" fill="#1c2628" opacity=".75"/>
    <rect x="60" y="92" width="96" height="6" rx="3" fill="#9fb5b9"/>
    <rect x="60" y="124" width="112" height="8" rx="4" fill="#1c2628" opacity=".75"/>
    <rect x="60" y="138" width="140" height="6" rx="3" fill="#9fb5b9"/>
    <rect x="60" y="170" width="120" height="8" rx="4" fill="#1c2628" opacity=".45"/>
    <rect x="60" y="184" width="84" height="6" rx="3" fill="#c6d6d9"/>
    <!-- code line -->
    <rect x="22" y="204" width="192" height="20" rx="8" fill="#0b1517"/>
    <text x="32" y="218" font-family="monospace" font-size="10" fill="#69d5e8">$ fastboot devices</text>
  </g>

  <!-- phone -->
  <g transform="translate(286 30) rotate(6 60 120)" filter="url(#shadow)">
    <rect width="124" height="240" rx="22" fill="url(#body)"/>
    <rect x="6" y="6" width="112" height="228" rx="17" fill="url(#screen)"/>
    <circle cx="62" cy="18" r="3.5" fill="#0b1517"/>
    <!-- check badge -->
    <circle cx="62" cy="104" r="30" fill="#ffffff" fill-opacity=".92"/>
    <path d="M48 104 l9 9 l18 -19" fill="none" stroke="#0097a7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="152" width="68" height="8" rx="4" fill="#ffffff" opacity=".9"/>
    <rect x="38" y="166" width="48" height="6" rx="3" fill="#e8fbfe" opacity=".7"/>
    <rect x="44" y="222" width="36" height="3" rx="1.5" fill="#ffffff" opacity=".7"/>
  </g>
</svg>
