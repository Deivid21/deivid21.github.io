<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Generic phones">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a4e"/>
      <stop offset="1" stop-color="#1c2628"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0aa3b5"/>
      <stop offset="1" stop-color="#006876"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69d5e8"/>
      <stop offset=".55" stop-color="#0097a7"/>
      <stop offset="1" stop-color="#01363e"/>
    </linearGradient>
    <linearGradient id="wall2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8eef9"/>
      <stop offset="1" stop-color="#3fb9a0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- left: back of a phone with camera module -->
  <g transform="translate(46 58) rotate(-12 60 110)" filter="url(#shadow)">
    <rect width="120" height="224" rx="20" fill="url(#back)"/>
    <rect x="14" y="14" width="48" height="66" rx="14" fill="#01363e" opacity=".55"/>
    <circle cx="38" cy="34" r="11" fill="#0b1517" stroke="#a8eef9" stroke-width="2.5"/>
    <circle cx="38" cy="60" r="11" fill="#0b1517" stroke="#a8eef9" stroke-width="2.5"/>
    <circle cx="38" cy="34" r="4" fill="#2d6f7a"/>
    <circle cx="38" cy="60" r="4" fill="#2d6f7a"/>
    <circle cx="54" cy="47" r="3" fill="#fff6c9"/>
    <g transform="translate(46 128)" opacity=".45">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="none" stroke="#e8fbfe" stroke-width="3"/>
    </g>
  </g>

  <!-- right: phone with a wave wallpaper -->
  <g transform="translate(278 58) rotate(12 60 110)" filter="url(#shadow)">
    <rect width="120" height="224" rx="20" fill="url(#body)"/>
    <rect x="6" y="6" width="108" height="212" rx="15" fill="url(#wall2)"/>
    <path d="M6 150 C 40 120, 70 175, 114 140 V 203 a15 15 0 0 1 -15 15 H 21 a15 15 0 0 1 -15 -15 Z" fill="#0097a7" opacity=".55"/>
    <path d="M6 175 C 45 150, 75 200, 114 170 V 203 a15 15 0 0 1 -15 15 H 21 a15 15 0 0 1 -15 -15 Z" fill="#01363e" opacity=".45"/>
    <circle cx="60" cy="16" r="3.5" fill="#0b1517"/>
    <text x="60" y="66" text-anchor="middle" font-family="Google Sans Flex, Roboto, Arial, sans-serif" font-size="26" font-weight="600" fill="#01363e">11:35</text>
  </g>

  <!-- center: front phone with app grid -->
  <g transform="translate(150 22)" filter="url(#shadow)">
    <rect width="140" height="262" rx="24" fill="url(#body)"/>
    <rect x="7" y="7" width="126" height="248" rx="18" fill="url(#wall)"/>
    <circle cx="70" cy="20" r="4" fill="#0b1517"/>
    <text x="70" y="70" text-anchor="middle" font-family="Google Sans Flex, Roboto, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">11:35</text>
    <text x="70" y="88" text-anchor="middle" font-family="Google Sans Flex, Roboto, Arial, sans-serif" font-size="9" fill="#e8fbfe" opacity=".85">Mon, Nov 16</text>
    <g fill="#ffffff" fill-opacity=".9">
      <rect x="22" y="176" width="20" height="20" rx="7"/>
      <rect x="49" y="176" width="20" height="20" rx="7" fill-opacity=".75"/>
      <rect x="76" y="176" width="20" height="20" rx="7" fill-opacity=".6"/>
      <rect x="103" y="176" width="20" height="20" rx="7" fill-opacity=".75"/>
    </g>
    <rect x="22" y="212" width="96" height="22" rx="11" fill="#ffffff" fill-opacity=".85"/>
    <circle cx="35" cy="223" r="5" fill="none" stroke="#0097a7" stroke-width="2"/>
    <rect x="52" y="246" width="36" height="3" rx="1.5" fill="#ffffff" opacity=".7"/>
  </g>
</svg>
