<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Phone in fastboot mode with an unlocked padlock">
  <defs>
    <radialGradient id="glow" cx="70%" cy="20%" r="80%">
      <stop offset="0" stop-color="#014e59"/>
      <stop offset="1" stop-color="#0b1517" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="760" height="300" rx="28" fill="#192123"/>
  <rect width="760" height="300" rx="28" fill="url(#glow)"/>
  <!-- phone -->
  <g transform="translate(300 28)">
    <rect width="160" height="300" rx="26" fill="#2d3638" stroke="#7f9499" stroke-width="3"/>
    <rect x="10" y="12" width="140" height="290" rx="18" fill="#0b1517"/>
    <circle cx="80" cy="26" r="5" fill="#374a4e"/>
    <!-- fastboot screen -->
    <text x="24" y="66" font-family="monospace" font-size="11" fill="#69d5e8">START</text>
    <rect x="22" y="76" width="116" height="1.5" fill="#374a4e"/>
    <text x="24" y="98" font-family="monospace" font-size="8.5" fill="#b4cacf">Fastboot Flash Mode</text>
    <text x="24" y="114" font-family="monospace" font-size="8.5" fill="#b4cacf">Product: moto</text>
    <text x="24" y="130" font-family="monospace" font-size="8.5" fill="#b4cacf">Device is UNLOCKED</text>
    <text x="24" y="146" font-family="monospace" font-size="8.5" fill="#f0616d">oem_locked: no</text>
    <!-- android robot head -->
    <g transform="translate(80 210)" fill="#3fb950">
      <path d="M-34 0 a34 34 0 0 1 68 0 z"/>
      <circle cx="-13" cy="-14" r="4" fill="#0b1517"/>
      <circle cx="13" cy="-14" r="4" fill="#0b1517"/>
      <rect x="-26" y="-46" width="3.5" height="16" rx="2" transform="rotate(-30 -24 -38)"/>
      <rect x="22.5" y="-46" width="3.5" height="16" rx="2" transform="rotate(30 24 -38)"/>
    </g>
  </g>
  <!-- unlocked padlock -->
  <g transform="translate(520 112)">
    <path d="M18 40 V22 a26 26 0 0 1 52 0" fill="none" stroke="#69d5e8" stroke-width="10" stroke-linecap="round" transform="translate(-18 -20) rotate(-18 44 22)"/>
    <rect x="-8" y="30" width="80" height="64" rx="14" fill="#69d5e8"/>
    <circle cx="32" cy="56" r="8" fill="#01363e"/>
    <rect x="29" y="58" width="6" height="18" rx="3" fill="#01363e"/>
  </g>
  <!-- fastboot command -->
  <g transform="translate(40 120)">
    <rect width="220" height="60" rx="14" fill="#232b2d"/>
    <text x="16" y="26" font-family="monospace" font-size="12" fill="#7f9499">$</text>
    <text x="30" y="26" font-family="monospace" font-size="12" fill="#d9e4e7">fastboot oem</text>
    <text x="30" y="44" font-family="monospace" font-size="12" fill="#69d5e8">unlock UNIQUE_KEY</text>
  </g>
</svg>
